name: Release

# Disparado por uma tag "vX.Y.Z" (ex.: v0.0.2). Publica no Marketplace do VS Code e no
# Open VSX Registry (necessário para VSCodium, code-server, Gitpod, Cursor e outros forks
# sem acesso ao Marketplace da Microsoft). Requer os secrets VSCE_PAT e OVSX_PAT configurados
# em Settings > Secrets and variables > Actions antes do primeiro uso.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:json
      - run: npm test
      - run: npx vsce package
      - name: Publicar no Visual Studio Marketplace
        run: npx vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publicar no Open VSX Registry
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Anexar .vsix à GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
